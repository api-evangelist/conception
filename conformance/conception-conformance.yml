source: Conception public statements, its 2026-08-07 science update, and trade-press coverage (2026-08-09 web search)
scope: >-
  Conception publishes no API, so there are no API or cross-cutting technical standards
  to assert. What the company is actually measured against is the US clinical/biologics
  regulatory pathway for a stem-cell-derived reproductive therapy, plus the ethical and
  legal regimes that govern human germline and embryo research. Those are recorded here
  as the applicable regimes, with status stated honestly as pre-clinical rather than
  achieved. The API/protocol standards block is recorded as not-applicable rather than
  false, so this file is never mistaken for a compliance posture the company does not
  claim.
regulatory_regime:
- id: fda-cber-ind-cell-therapy
  name: >-
    US FDA CBER Investigational New Drug pathway for human cells, tissues and
    cellular/tissue-based products (21 CFR 1271 / 21 CFR 312)
  conforms: false
  status: pre-clinical
  evidence: >-
    Conception's 2026-08-07 update reports fully stem-cell-derived human ovarian
    follicles containing early oocytes progressing through meiosis - a laboratory
    milestone. The company itself states the next steps are growing follicles to the
    antral stage and "extensive safety validation" before any clinical application. No
    IND filing, clinical trial registration, or FDA clearance has been published.
  note: >-
    Recorded as conforms:false because no clinical authorization exists, not because
    the company failed a check. Re-probe on the next pass.
- id: us-appropriations-rider-heritable-modification
  name: >-
    US federal appropriations rider barring FDA review of applications involving
    heritable genetic modification of a human embryo
  conforms: false
  applicable: true
  evidence: >-
    In-vitro gametogenesis is repeatedly discussed in the bioethics literature (ISSCR
    guidance, Johns Hopkins Berman Institute coverage) as sitting adjacent to this
    restriction because the product is a gamete. Conception has published no statement
    of its regulatory reading of the rider.
  note: informational - a live policy constraint on the field, not a certification.
- id: isscr-guidelines-stem-cell-research
  name: ISSCR Guidelines for Stem Cell Research and Clinical Translation
  conforms: unknown
  applicable: true
  evidence: >-
    Standard governance framework for human iPSC and in-vitro gametogenesis work.
    Conception publishes no oversight/EAC statement on its site, so adherence cannot
    be verified from public sources.
