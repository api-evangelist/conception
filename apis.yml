aid: conception
name: Conception
description: 'Conception is a Berkeley, California biotechnology company founded in
  2018 by CEO Matt Krisiloff (previously a director of Y Combinator Research and an
  early OpenAI team member) and originally operated under the name Ovid Research. It
  is building in-vitro gametogenesis (IVG) as a clinical therapy: taking a patient
  blood draw, reprogramming the blood cells into induced pluripotent stem cells, and
  then guiding those cells through primordial germ cell, oogonia and follicle stages
  inside engineered three-dimensional ovarian organoids until they mature into viable
  human eggs. Its laboratory stack combines single-cell gene-expression mapping, 3D
  tissue engineering, high-throughput screening and computer-vision quality control,
  and in an announcement published 2026-08-07 the company reported generating the first
  fully stem-cell-derived human ovarian follicles containing early oocytes progressing
  through meiosis. Conception has raised roughly USD 38 million from investors including
  Age 1, Calm Ventures, SciFounders, Gaingels, Maiora Ventures and PEAK6 Strategic
  Capital. It is a wet-lab therapeutic research company rather than a software vendor:
  its entire public web presence is a two-page Framer marketing site with a science-updates
  post and an Ashby-hosted job board, and it publishes no developer portal, no API
  documentation, no SDKs and no machine-readable API contract of any kind.'
